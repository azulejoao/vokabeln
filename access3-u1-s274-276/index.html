<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vokabeltrainer Access 3 Unit 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;800&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* Layout: one centred column; the question card is a station sign with a yellow platform-edge stripe; the Lernkartei shows as five "Fächer". */
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#14283a; --muted:#5a6b7a; --line:#d3dce3;
  --sign:#1b3a57; --sign-fg:#ffffff; --signal:#f2b705; --signal-ink:#3b2c00;
  --good:#1d7f47; --good-bg:#e2f3e9; --bad:#b8322b; --bad-bg:#fbe7e5; --hint-bg:#fff5d1; --near:#9a6a00;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-ipa:"Noto Sans", "Lucida Sans Unicode", "Arial Unicode MS", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1720; --surface:#16222e; --ink:#e6edf2; --muted:#9aaab8; --line:#2a3a48;
  --sign:#234a70; --sign-fg:#ffffff; --signal:#f5c33b; --signal-ink:#2a1f00;
  --good:#5fd08f; --good-bg:#16301f; --bad:#ff8a7f; --bad-bg:#3a1e1c; --hint-bg:#352c12; --near:#f2c75c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1720; --surface:#16222e; --ink:#e6edf2; --muted:#9aaab8; --line:#2a3a48;
  --sign:#234a70; --sign-fg:#ffffff; --signal:#f5c33b; --signal-ink:#2a1f00;
  --good:#5fd08f; --good-bg:#16301f; --bad:#ff8a7f; --bad-bg:#3a1e1c; --hint-bg:#352c12; --near:#f2c75c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6vw,36px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:700 15px var(--f-body);padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:none;color:var(--ink);font:600 14px var(--f-body);padding:8px 12px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sign);color:var(--sign-fg)}
select,.btn{font:600 14px var(--f-body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn:hover,select:hover{border-color:var(--muted)}
.btn.primary{background:var(--sign);color:var(--sign-fg);border-color:var(--sign)}
.btn.signal{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.btn.ghost{background:none}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.progress{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--sign);width:0;transition:width .3s}
/* station-sign card */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.sign{background:var(--sign);color:var(--sign-fg);padding:18px 20px 16px;display:flex;flex-direction:column;gap:8px}
.sign .meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.16)}
.prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,5.5vw,32px);line-height:1.2;text-wrap:balance}
.edge{height:10px;background:repeating-linear-gradient(90deg,var(--signal) 0 26px,var(--sign) 26px 30px)}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.answer-row{display:flex;gap:8px;flex-wrap:wrap}
.answer-row input{flex:1 1 220px;min-width:0;font:400 20px var(--f-body);padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.answer-row input:focus{border-color:var(--sign);outline:none}
.hints{display:flex;flex-wrap:wrap;gap:8px}
.hints .btn{font-size:13px;padding:6px 10px}
.hints .btn[disabled]{opacity:.45;cursor:default}
.hintbox{background:var(--hint-bg);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.hintbox p{margin:0}
.hintbox b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.letters{font-family:var(--f-ipa);font-size:20px;letter-spacing:.18em}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb.good{background:var(--good-bg)} .fb.bad{background:var(--bad-bg)} .fb.near{background:var(--hint-bg)}
.fb .verdict{font-weight:700}
.fb.good .verdict{color:var(--good)} .fb.bad .verdict{color:var(--bad)} .fb.near .verdict{color:var(--near)}
.solution{display:flex;flex-direction:column;gap:6px}
.solution .en{font-family:var(--f-display);font-weight:700;font-size:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ipa{font-family:var(--f-ipa);font-weight:400;font-size:16px;color:var(--muted)}
.solution p{margin:0}
.note{border-left:4px solid var(--bad);padding-left:10px}
.cog{color:var(--muted);font-size:14px}
.speak{font-size:13px;padding:4px 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.mc button{text-align:left;font:600 17px var(--f-body);padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.mc button.right{border-color:var(--good);background:var(--good-bg)}
.mc button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mc button[disabled]{cursor:default}
/* Lernkartei */
.kartei{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fach{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;font-variant-numeric:tabular-nums}
.fach .n{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.fach .l{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.fach.on{border-color:var(--signal);box-shadow:inset 0 -4px 0 var(--signal)}
.small{font-size:13px;color:var(--muted)}
.end{display:flex;flex-direction:column;gap:12px}
.big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1}
ul.miss{margin:0;padding-left:18px}
/* Merkkästen + Wortliste */
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-family:var(--f-display);font-size:18px;color:var(--sign)}
:root[data-theme="dark"] .box h3{color:var(--signal)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .box h3{color:var(--signal)}}
.pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 16px}
.pairs .e{font-weight:700}
.warn{display:flex;gap:8px;align-items:flex-start}
.bang{flex:none;background:var(--bad);color:#fff;font-weight:800;border-radius:4px;width:20px;height:20px;display:grid;place-items:center;font-size:13px;margin-top:2px}
.notes{display:flex;flex-direction:column;gap:8px}
.tbl{overflow-x:auto;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--surface)}
td.num{font-variant-numeric:tabular-nums;color:var(--muted)}
.resetrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:480px){.pairs{grid-template-columns:1fr}.pairs .d{margin-bottom:6px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .25s}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Access 3 · Unit 1 · Buch S. 274–276 · Deutsch → Englisch</span>
    <h1>Vokabeltrainer: piano bis rice</h1>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-train" aria-selected="true" data-view="train">Üben</button>
    <button class="tab" role="tab" id="tab-boxes" aria-selected="false" data-view="boxes">Merkkästen</button>
    <button class="tab" role="tab" id="tab-list" aria-selected="false" data-view="list">Wortliste</button>
  </nav>

  <!-- TRAIN -->
  <section id="view-train" class="wrap" style="gap:14px">
    <div class="controls">
      <div class="seg" role="group" aria-label="Modus">
        <button id="m-type" data-mode="type">Schreiben</button>
        <button id="m-cards" data-mode="cards">Karteikarten</button>
        <button id="m-mc" data-mode="mc">Auswahl</button>
      </div>
      <select id="set" aria-label="Wörter auswählen">
        <option value="all">Alle Wörter</option>
                <option value="274">Nur S. 274</option>
        <option value="275">Nur S. 275</option>
        <option value="276">Nur S. 276</option>
        <option value="weak">Schwache Wörter (Fach 1–2)</option>
      </select>
      <button class="btn ghost" id="restart">Neu mischen</button>
    </div>

    <div class="progress"><span id="pos">1 / 60</span><div class="bar"><span id="barfill"></span></div><span id="pts">0 Punkte</span></div>

    <article class="card" id="qcard">
      <div class="sign">
        <div class="meta"><span class="chip" id="c-page">S. 274</span><span class="chip" id="c-pos">Nomen</span></div>
        <div class="prompt" id="prompt">das Klavier</div>
      </div>
      <div class="edge" aria-hidden="true"></div>
      <div class="body">
        <div id="typeArea" class="answer-row">
          <input id="answer" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Englisch eingeben …" aria-label="Übersetzung">
          <button class="btn primary" id="checkBtn">Prüfen</button>
        </div>
        <div id="mcArea" class="mc" hidden></div>
        <div class="hints" id="hintBtns">
          <button class="btn" data-hint="hint">Tipp</button>
          <button class="btn" data-hint="mnemo">Eselsbrücke</button>
          <button class="btn" data-hint="letters">Anfangsbuchstaben</button>
          <button class="btn" data-hint="ex">Beispielsatz</button>
        </div>
        <div class="hintbox" id="hintbox" hidden></div>
        <div class="fb" id="fb" hidden></div>
        <div class="actions">
          <button class="btn ghost" id="skipBtn">Weiß ich nicht</button>
          <button class="btn signal" id="flipBtn" hidden>Umdrehen</button>
          <button class="btn" id="noBtn" hidden>Nicht gewusst</button>
          <button class="btn primary" id="yesBtn" hidden>Gewusst</button>
          <button class="btn primary" id="nextBtn" hidden>Weiter</button>
        </div>
      </div>
    </article>

    <article class="card end" id="endcard" hidden>
      <div class="body end" id="endbody"></div>
    </article>

    <div>
      <div class="small" style="margin-bottom:6px">Lernkartei: Richtig (ohne viele Tipps) wandert ein Wort ein Fach weiter, falsch zurück in Fach 1.</div>
      <div class="kartei" id="kartei"></div>
    </div>
  </section>

  <!-- BOXES -->
  <section id="view-boxes" class="wrap" style="gap:14px" hidden></section>

  <!-- LIST -->
  <section id="view-list" class="wrap" style="gap:14px" hidden></section>
</div>

function norm(s){
  let t = String(s).toLowerCase().replace(/[’`´]/g, "'").replace(/\((to|pl)\)/g, " ")
    .replace(/\b(sb|sth|somebody|something|someone)\b\.?/g, " ")

  return t.trim();
}
function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_, j) => j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function shuffle(a){ for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function poolIds(){
  let list = ITEMS;
  if(/^\d+$/.test(prefs.set)) list = ITEMS.filter(x => String(x.p) === prefs.set);
  if(prefs.set === "weak"){ list = ITEMS.filter(x => boxOf(x.id) <= 2); if(!list.length) list = ITEMS; }
  return list.map(x => x.id);
}

let S;
function startRound(ids){
  S = {queue: shuffle(ids.slice()), i:0, points:0, max:0, first:{}, repeats:{}, hints:new Set(), tries:0, answered:false, flipped:false};
  $("#endcard").hidden = true; $("#qcard").hidden = false;
  renderQ();
}
const cur = () => BYID[S.queue[S.i]];

function exHTML(it, reveal){
  return esc(it.ex).replace(/\{(.+?)\}/, (_, w) => reveal ? "<b>" + w + "</b>" : "<b>" + w.replace(/[^\s]/g, "_") + "</b>");
}
function lettersOf(it){
  return it.acc[0].split(" ").map(w => w[0] + " " + "_ ".repeat(Math.max(0, w.length-1)).trim()).join("   ");
}
function solutionHTML(it){
  let h = '<div class="solution"><div class="en">' + esc(it.en) + ' <span class="ipa">[' + esc(it.ipa) + ']</span>'
    + '<button class="btn speak" data-say="' + esc(it.acc[0]) + '">Anhören</button></div>'
    + '<p>' + exHTML(it, true) + '</p>';
  if(it.note) h += '<p class="note">' + esc(it.note) + '</p>';
  h += '<p class="small"><b>Eselsbrücke:</b> ' + esc(it.mnemo) + '</p>';
  if(it.cog) h += '<p class="cog">Verwandte Wörter: ' + esc(it.cog) + '</p>';
  return h + '</div>';
}

function renderQ(){
  if(S.i >= S.queue.length) return renderEnd();
  const it = cur();
  S.hints = new Set(); S.tries = 0; S.answered = false; S.flipped = false;
  $("#prompt").textContent = it.de;
  $("#c-page").textContent = "S. " + it.p;
  $("#c-pos").textContent = POS[it.pos] || it.pos;
  $("#pos").textContent = (S.i+1) + " / " + S.queue.length;
  $("#barfill").style.width = (100 * S.i / S.queue.length) + "%";
  $("#pts").textContent = S.points + " Punkte";
  $("#hintbox").hidden = true; $("#hintbox").innerHTML = "";
  $("#fb").hidden = true; $("#fb").className = "fb"; $("#fb").style.background = "";
  document.querySelectorAll("#hintBtns .btn").forEach(b => b.disabled = false);
  $("#hintBtns").hidden = false;
  const m = prefs.mode;
  $("#typeArea").hidden = m !== "type";
  $("#mcArea").hidden = m !== "mc";
  $("#skipBtn").hidden = m === "cards";
  $("#flipBtn").hidden = m !== "cards";
  $("#yesBtn").hidden = $("#noBtn").hidden = true;
  $("#nextBtn").hidden = true;
  if(m === "type"){ $("#answer").value = ""; $("#answer").disabled = false; $("#checkBtn").disabled = false; focusInput(); }
  if(m === "mc") renderMC(it);
  renderKartei();
}
// Touch devices (iPhone/iPad): never auto-focus the text field, or the keyboard pops up on every tap (hint, next card).
const TOUCH = (() => { try{ return matchMedia("(hover: none) and (pointer: coarse)").matches; }catch(e){ return false; } })();
function focusInput(){ if(TOUCH) return; try{ $("#answer").focus({preventScroll:true}); }catch(e){} }

function renderMC(it){
  const same = ITEMS.filter(x => x.id !== it.id && x.pos === it.pos && x.en !== it.en);
  const others = ITEMS.filter(x => x.id !== it.id && x.en !== it.en);
  const picks = [];
  for(const x of shuffle(same.slice()).concat(shuffle(others.slice()))){ if(picks.length >= 3) break; if(!picks.some(p => p.en === x.en)) picks.push(x); }
  const opts = shuffle([it].concat(picks));
  const box = $("#mcArea"); box.innerHTML = "";
  opts.forEach(o => {
    const b = document.createElement("button");
    b.textContent = o.en; b.dataset.ok = o.id === it.id ? "1" : "0";
    b.addEventListener("click", () => {
      if(S.answered) return;
      const ok = b.dataset.ok === "1";
      box.querySelectorAll("button").forEach(x => { x.disabled = true; if(x.dataset.ok === "1") x.classList.add("right"); });
      if(!ok) b.classList.add("wrong");
      finish(ok);
    });
    box.appendChild(b);
  });
}

function showHint(kind){
  if(S.answered) return;
  const it = cur(); S.hints.add(kind);
  const label = {hint:"Tipp", mnemo:"Eselsbrücke", letters:"Anfangsbuchstaben", ex:"Beispielsatz"}[kind];
  let body = kind === "hint" ? esc(it.hint) : kind === "mnemo" ? esc(it.mnemo)
    : kind === "letters" ? '<span class="letters">' + esc(lettersOf(it)) + '</span>' : exHTML(it, false);
  const hb = $("#hintbox"); hb.hidden = false;
  hb.insertAdjacentHTML("beforeend", "<p><b>" + label + "</b>" + body + "</p>");
  document.querySelector('#hintBtns [data-hint="' + kind + '"]').disabled = true;
  if(prefs.mode === "type") focusInput();
}

// ---- Answer matching (Jan, 11.11.2026): the sense counts, not the exact wording ----
// 1) exact (after norm)  2) same core words: small words (to, a, the, I'm, is, get …) ignored,
//    word forms ignored (cook / cooking / cooked, light / lights)  3) small typo in a core word.
// No synonyms: the core word itself must be there. Prepositions that belong to the phrase (good AT) must be there.
const FILLER = new Set(("a an the to sb sth somebody something someone one oneself pl i me my mine you your he him his she her it its " +
  "we us our they them their this that these those am is are was were be been being get gets got getting gotten do does did done " +
  "will would shall should can could may might must m s re ve ll d der die das den dem des ein eine einen einem einer").split(" "));
function stem(w){
  if(w.length <= 3 || /\d/.test(w)) return w;
  let s = w;
  if(/ie[sd]$/.test(s) && s.length > 4) s = s.slice(0, -3) + "y";
  else if(/ing$/.test(s) && s.length > 5) s = s.slice(0, -3);
  else if(/ed$/.test(s) && s.length > 4) s = s.slice(0, -2);
  else if(/(s|x|z|ch|sh)es$/.test(s)) s = s.slice(0, -2);
  else if(/[^su]s$/.test(s)) s = s.slice(0, -1);
  if(/([b-df-hj-np-tv-z])\1$/.test(s) && !/(ll|ss|zz|ff)$/.test(s)) s = s.slice(0, -1);
  if(s.length > 3 && /e$/.test(s)) s = s.slice(0, -1);
  return s;
}
function core(s){
  return norm(s).replace(/(\d)([a-zäöüß]{3,})/g, "$1 $2").replace(/n't\b/g, " not").replace(/'/g, " ").split(" ")
    .filter(w => w && !FILLER.has(w)).map(stem);
}
// typo: same first letter, 1 wrong letter from 6 letters, 2 from 9 (short words like brake/break or east/west are never "typos")
function nearWord(e, u){ if(e[0] !== u[0]) return false; const d = lev(e, u); return (d <= 1 && e.length >= 6) || (d <= 2 && e.length >= 9); }
function judge(v, it){
  const n = norm(v), ns = n.replace(/ /g, ""), accs = it.acc.map(norm);
  if(accs.includes(n) || accs.some(a => a.replace(/ /g, "") === ns)) return "exact";
  const U = core(v); if(!U.length) return "";
  const accStems = new Set(it.acc.flatMap(core));
  const wrongStems = new Set((it.wrong || []).flatMap(core).filter(w => !accStems.has(w)));
  for(const a of it.acc){
    const E = core(a); if(!E.length) continue;
    const used = new Set(); let typo = false, all = true;
    for(const e of E){
      let j = U.findIndex((u, k) => !used.has(k) && u === e);
      if(j < 0){ j = U.findIndex((u, k) => !used.has(k) && nearWord(e, u)); if(j >= 0) typo = true; }
      if(j < 0){ all = false; break; }
      used.add(j);
    }
    if(!all) continue;
    const extra = U.filter((u, k) => !used.has(k));
    // extra words are fine ("I'm cooking tonight"), but not too many, no other numbers/models, no wrong option
    if(extra.length > 2 || extra.some(u => /\d/.test(u) || wrongStems.has(u))) continue;
    return typo ? "typo" : "close";
  }
  return "";
}
function check(){
  if(S.answered) return next();
  const inp = $("#answer"), v = inp.value;
  if(!v.trim()){ inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); return; }
  const it = cur(), how = judge(v, it);
  if(how) return finish(true, v, how);
  const n = norm(v), d = Math.min(...it.acc.map(a => lev(norm(a), n)));
  const near = (d === 1 && n.length >= 3) || (d === 2 && n.length >= 8);
  if(S.tries === 0){
    S.tries++;
    const fb = $("#fb"); fb.hidden = false;
    fb.className = "fb near";
    fb.innerHTML = near ? '<span class="verdict">Fast! Prüfe die Rechtschreibung.</span><span class="small">Ein Buchstabe stimmt noch nicht. Versuch es nochmal.</span>'
                        : '<span class="verdict">Noch nicht richtig.</span><span class="small">Nimm einen Tipp oder die Eselsbrücke und versuch es nochmal.</span>';
    inp.select(); return;
  }
  finish(false, v);
}

function finish(ok, given, how){
  const it = cur(); S.answered = true;
  if(how === "typo") S.hints.add("spelling");   // typo: still right, one point less
  const firstTime = !(it.id in S.first);
  const pts = ok ? Math.max(1, 3 - S.hints.size - S.tries) : 0;
  if(firstTime){ S.first[it.id] = ok; S.max += 3; S.points += pts; }
  if(ok){ if(S.hints.size <= 1 && S.tries === 0) setBox(it.id, boxOf(it.id) + 1); }
  else {
    setBox(it.id, 1);
    const r = S.repeats[it.id] || 0;
    if(r < 2){ S.repeats[it.id] = r + 1; S.queue.splice(Math.min(S.queue.length, S.i + 4), 0, it.id); }
  }
  const fb = $("#fb"); fb.hidden = false; fb.className = "fb " + (ok ? "good" : "bad");
  let head = ok ? (pts === 3 ? "Richtig! +3" : "Richtig! +" + pts) : "Leider falsch – das Wort kommt gleich nochmal.";
  if(ok && how === "close") head += ' <span class="small">Der Sinn stimmt. Merk dir die genaue Form unten.</span>';
  if(ok && how === "typo") head += ' <span class="small">Fast richtig geschrieben. Achte auf die Schreibweise unten.</span>';
  if(!ok && given) head += ' <span class="small">(Deine Antwort: „' + esc(given) + '“)</span>';
  fb.innerHTML = '<span class="verdict">' + head + '</span>' + solutionHTML(it);
  $("#hintBtns").hidden = true;
  if(prefs.mode === "type"){ $("#answer").disabled = true; $("#checkBtn").disabled = true; }
  $("#skipBtn").hidden = true; $("#flipBtn").hidden = true; $("#yesBtn").hidden = $("#noBtn").hidden = true;
  $("#nextBtn").hidden = false;
  $("#pts").textContent = S.points + " Punkte";
  try{ $("#nextBtn").focus({preventScroll:true}); }catch(e){}
  renderKartei();
}
function next(){ S.i++; renderQ(); }

function flip(){
  const it = cur(); S.flipped = true;
  const fb = $("#fb"); fb.hidden = false; fb.className = "fb"; fb.style.background = "var(--bg)";
  fb.innerHTML = solutionHTML(it);
  $("#flipBtn").hidden = true; $("#hintBtns").hidden = true;
  $("#yesBtn").hidden = $("#noBtn").hidden = false;
  try{ $("#yesBtn").focus({preventScroll:true}); }catch(e){}
}

function renderEnd(){
  $("#qcard").hidden = true; $("#endcard").hidden = false;
  $("#barfill").style.width = "100%";
  const ids = Object.keys(S.first).map(Number);
  const right = ids.filter(id => S.first[id]).length;
  const miss = ids.filter(id => !S.first[id]);
  const pct = S.max ? Math.round(100 * S.points / S.max) : 0;
  const grade = pct >= 92 ? "Hervorragend!" : pct >= 80 ? "Sehr gut!" : pct >= 65 ? "Gut gemacht!" : pct >= 50 ? "Weiter üben – du schaffst das!" : "Übung macht den Meister. Nochmal mit Tipps!";
  let h = '<span class="eyebrow">Runde geschafft</span><div class="big">' + pct + ' %</div>'
    + '<p style="margin:0"><b>' + grade + '</b> ' + right + ' von ' + ids.length + ' Wörtern beim ersten Versuch richtig, ' + S.points + ' von ' + S.max + ' Punkten.</p>';
  if(miss.length){
    h += '<h2 style="font-size:18px">Diese Wörter üben</h2><ul class="miss">'
      + miss.map(id => '<li>' + esc(BYID[id].de) + ' → <b>' + esc(BYID[id].en) + '</b></li>').join("") + '</ul>';
  }
  h += '<div class="actions" style="justify-content:flex-start">'
    + (miss.length ? '<button class="btn signal" id="redoMiss">Fehler wiederholen</button>' : '')
    + '<button class="btn primary" id="again">Neue Runde</button></div>';
  $("#endbody").innerHTML = h;
  if(miss.length) $("#redoMiss").addEventListener("click", () => startRound(miss));
  $("#again").addEventListener("click", () => startRound(poolIds()));
  renderKartei();
}

function renderKartei(){
  const ids = poolIds(), c = [0,0,0,0,0];
  ids.forEach(id => c[boxOf(id)-1]++);
  const now = S && S.i < S.queue.length ? boxOf(cur().id) : 0;
  $("#kartei").innerHTML = c.map((n, i) => '<div class="fach' + (now === i+1 ? " on" : "") + '"><div class="n">' + n + '</div><div class="l">Fach ' + (i+1) + '</div></div>').join("");
}

function say(text){
  try{
    if(!("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(text.replace(/\//g, " or "));
    u.lang = DATA.meta.speech_lang || "en-GB"; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => v.lang.replace("_","-").toLowerCase() === (DATA.meta.speech_lang || "en-GB").toLowerCase());
    if(v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* --- Merkkästen + Wortliste --- */
function renderBoxes(){
  let h = (DATA.boxes || []).map(B => '<div class="box"><h3>' + esc(B.title) + '</h3><div class="pairs">'
    + B.rows.map(r => '<div class="e">' + esc(r[0]) + '</div><div class="d">' + esc(r[1]) + '</div>').join("") + '</div>'
    + (B.warn ? '<div class="warn"><span class="bang">!</span><span><b>' + esc(B.warn[0]) + '</b><br>' + esc(B.warn[1]) + '</span></div>' : '') + '</div>').join("");
  h += '<div class="box"><h3>Aufgepasst! (Hinweise aus dem Buch)</h3><div class="notes">'
    + ITEMS.filter(x => x.note && !/^Merkkasten|^Siehe Merkkasten/.test(x.note)).map(x => '<div class="warn"><span class="bang">!</span><span><b>' + esc(x.en) + '</b> – ' + esc(x.note) + '</span></div>').join("")
    + '</div></div>';
  const cogs = ITEMS.filter(x => x.cog);
  if(cogs.length) h += '<div class="box"><h3>Verwandte Wörter (F = Französisch, L = Latein)</h3><div class="pairs">'
    + cogs.map(x => '<div class="e">' + esc(x.en) + '</div><div class="d">' + esc(x.cog) + '</div>').join("") + '</div></div>';
  $("#view-boxes").innerHTML = h;
}
function renderList(){
  let h = '<div class="tbl"><table><thead><tr><th>S.</th><th>Deutsch</th><th>Englisch</th><th>Aussprache</th><th>Fach</th></tr></thead><tbody>'
    + ITEMS.map(x => '<tr><td class="num">' + x.p + '</td><td>' + esc(x.de) + '</td><td><b>' + esc(x.en) + '</b></td><td class="ipa">[' + esc(x.ipa) + ']</td><td class="num">' + boxOf(x.id) + '</td></tr>').join("")
    + '</tbody></table></div>'
    + '<div class="resetrow"><button class="btn ghost" id="resetBtn">Lernkartei zurücksetzen</button><span class="small" id="resetMsg"></span></div>';
  $("#view-list").innerHTML = h;
  $("#resetBtn").addEventListener("click", e => {
    const b = e.currentTarget;
    if(b.dataset.armed){ leit = {}; store.set(KEY + "-kartei", leit); renderList(); renderKartei(); $("#resetMsg").textContent = "Alle Wörter sind wieder in Fach 1."; }
    else { b.dataset.armed = "1"; b.textContent = "Ja, wirklich zurücksetzen"; $("#resetMsg").textContent = "Dein Fortschritt geht dabei verloren."; }
  });
}

/* --- wiring --- */
function setMode(m){
  prefs.mode = m; store.set(KEY + "-prefs", prefs);
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m ? "true" : "false"));
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { setMode(b.dataset.mode); if(S && S.i < S.queue.length && !S.answered) renderQ(); else if(!S || S.i >= S.queue.length) startRound(poolIds()); }));
$("#set").addEventListener("change", e => { prefs.set = e.target.value; store.set(KEY + "-prefs", prefs); startRound(poolIds()); });
$("#restart").addEventListener("click", () => startRound(poolIds()));
$("#checkBtn").addEventListener("click", check);
$("#answer").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); check(); } });
$("#skipBtn").addEventListener("click", () => finish(false));
$("#nextBtn").addEventListener("click", next);
$("#flipBtn").addEventListener("click", flip);
$("#yesBtn").addEventListener("click", () => { $("#fb").style.background = ""; finish(true); });
$("#noBtn").addEventListener("click", () => { $("#fb").style.background = ""; finish(false); });
$("#hintBtns").addEventListener("click", e => { const b = e.target.closest("[data-hint]"); if(b && !b.disabled) showHint(b.dataset.hint); });
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if(b) say(b.dataset.say); });
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" || !S || $("#view-train").hidden) return;
  if(S.answered && document.activeElement !== $("#nextBtn") && !$("#nextBtn").hidden){ e.preventDefault(); next(); }
});
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t ? "true" : "false"));
  ["train","boxes","list"].forEach(v => $("#view-" + v).hidden = v !== t.dataset.view);
  if(t.dataset.view === "boxes") renderBoxes();
  if(t.dataset.view === "list") renderList();
}));

setMode(prefs.mode);
$("#set").value = prefs.set;
startRound(poolIds());
</script>
